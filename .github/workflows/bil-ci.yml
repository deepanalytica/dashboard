name: BIL / Validar y publicar
on:
  push:
    branches: [master]
    paths: ['public/**', 'brands/**', 'tools/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/bil-ci.yml']
  pull_request:
    paths: ['public/**', 'brands/**', 'tools/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/bil-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  github-pages:
    if: github.ref == 'refs/heads/master' && vars.BIL_GITHUB_PAGES_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  cloudflare-pages:
    if: github.ref == 'refs/heads/master' && vars.BIL_CLOUDFLARE_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Publicar en Cloudflare Pages (Direct Upload)
        run: npx --yes wrangler@4 pages deploy dist --project-name bil-studio --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
