name: BIL / Validar y publicar
on:
  push:
    branches: [master]
    paths: ['public/**', 'brands/**', 'tools/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/bil-ci.yml']
  pull_request:
    paths: ['public/**', 'brands/**', 'tools/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/bil-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  github-pages:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Habilitar GitHub Pages mediante API (si hace falta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          status=$(curl -sS -o /tmp/bil-pages.json -w '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "${api}")
          if [ "${status}" = "404" ]; then
            echo 'Creando GitHub Pages en modo workflow'
            curl --fail-with-body -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"build_type":"workflow"}' "${api}" > /dev/null
          elif [ "${status}" = "200" ]; then
            if ! jq -e '.build_type == "workflow"' /tmp/bil-pages.json > /dev/null; then
              echo 'Cambiando GitHub Pages a modo workflow'
              curl --fail-with-body -sS -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"build_type":"workflow"}' "${api}" > /dev/null
            fi
          else
            cat /tmp/bil-pages.json
            echo "Error al consultar Pages: ${status}" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  cloudflare-pages:
    if: github.ref == 'refs/heads/master' && vars.BIL_CLOUDFLARE_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Publicar en Cloudflare Pages (Direct Upload)
        run: npx --yes wrangler@4 pages deploy dist --project-name bil-studio --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
